# XcodeGen project (https://github.com/yonaskolb/XcodeGen)
#   brew install xcodegen
#   xcodegen generate
#   open PrefixBlocker.xcodeproj
#
# The developer team, bundle identifier and App Group come from
# Config/Signing.xcconfig. To build under your own account, copy
# Config/Local.xcconfig.example to Config/Local.xcconfig and set them there.

name: PrefixBlocker

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"

# One Call Directory extension per slot. They share all their code; only the
# slot index differs. Their number must match AppConstants.slotCount.
targetTemplates:
  Shard:
    type: app-extension
    platform: iOS
    sources:
      - Extension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).shard${slotLabel}
        SLOT_INDEX: ${slotIndex}
        SLOT_LABEL: ${slotLabel}
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/Shard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

targets:
  PrefixBlocker:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/PrefixBlocker.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
